limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
upstream frontend_upstream { server frontend:80; }
upstream backend_upstream { server backend:3000; }
server {
  listen 80;
  server_name _;
  client_max_body_size 105m;
  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://backend_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://backend_upstream; proxy_set_header Host $host; }
  location / { proxy_pass http://frontend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
